<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evenement</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 flex h-screen overflow-hidden">


    <aside class="w-64 bg-gray-900 text-white flex flex-col hidden md:flex">
        <div class="p-6">

            <h2>admin blog</h2>
        </div>
        <nav>
            <a href="#">Tableau de bord</a>
            <a href="#">Categories</a>
        </nav>
    </aside>

    <header>
        <div>
            Gestion des categories
        </div>
        <div>
            admin
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-6 bg-gray-50">
        <div class="max-w-5x1 mx-auto space-y-8">
            <div class="flex flex-col items-start gap-4">
                <div>
                    <h1 class="text-2x1 font-bold text-gray-900">Categories</h1>

                </div>

                <button id="btn_add" class="bg-primary-600 text-white px-4 ">
                    + Nouvelle Categorie
                </button>
            </div>

            <div id="sec_form">
                <h2>ajouter</h2>

                <form id="form_cat">

                    <label for="nom">Nom</label>
                    <input type="text" id="nom" placeholder="nom">

                    <label for="desc" >desc</label>
                    <textarea  id="desc"></textarea>

                    <button type="submit" id="btn_submit">Enregistrer</button>
                    <button type="button" id="btn_annuel">annuler</button>
                    
                </form>

            </div>


            <div>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr>
                            <th class="p-4 text-sm font-semibold text-gray-500 ">Nom</th>
                            <th class="p-4 text-sm font-semibold text-gray-500 ">Desc</th>
                        </tr>
                    </thead>
                    <tbody id="table-category" class="divide-y divide-gray-100">

                    </tbody>

                </table>
                <div class="fixed top-4 right-4 z-50" id="toast_con"></div>
            </div>



        </div>
    </main>

    <script src="js/main.js"></script>

    
</body>
</html>
